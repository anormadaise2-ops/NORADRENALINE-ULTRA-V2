name: Deploy NORADRENALINE website

on:
  push:
    branches: [main, master]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure release source
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          python -c "import json, os; json.dump({'repository': os.environ['GITHUB_REPOSITORY_NAME']}, open('website/site-config.json', 'w', encoding='utf-8'))"

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
