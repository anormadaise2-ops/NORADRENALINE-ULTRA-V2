name: Build Windows installer

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "NORA-X1-DRIVER/**"
      - "installer/**"
      - "BUILD-INSTALLER.ps1"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "NORA-X1-DRIVER/**"
      - "installer/**"
      - "BUILD-INSTALLER.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build and package
        shell: pwsh
        run: .\BUILD-INSTALLER.ps1

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: NORADRENALINE-ULTRA-Windows-x64
          path: |
            dist/NORADRENALINE-ULTRA-Windows-x64.zip
            dist/NORADRENALINE-ULTRA-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
